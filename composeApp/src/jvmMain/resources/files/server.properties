# ????????????????????????????????????????????????????????
# CONFIGURACIÓN DEL SERVIDOR - HUNDIR LA FLOTA
# ????????????????????????????????????????????????????????

# ????????????????????????????????????????????????????????
# RED Y CONEXIONES
# ????????????????????????????????????????????????????????

# Dirección IP del servidor (0.0.0.0 = todas las interfaces)
server.host=0.0.0.0

# Puerto TCP del servidor
server.port=5678

# Número máximo de clientes simultáneos
max.clients=10

# ????????????????????????????????????????????????????????
# CONFIGURACIÓN DEL JUEGO
# ????????????????????????????????????????????????????????

# Tamaño del tablero (NxN) - Recomendado: 10
board.size=10

# Permitir barcos adyacentes (true/false)
allow.adjacency=false

# Número de rondas (mejor de N) - Valores: 1, 3, 5
max.rounds=1

# ????????????????????????????????????????????????????????
# INTELIGENCIA ARTIFICIAL (PVE)
# ????????????????????????????????????????????????????????

# Dificultad de la IA - Valores: EASY, NORMAL, HARD
# EASY:   Disparos completamente aleatorios
# NORMAL: Hunt & Target mode (patrón ajedrez + seguimiento)
# HARD:   Normal + evita adyacentes + predice dirección
ai.difficulty=NORMAL

# ????????????????????????????????????????????????????????
# TIMEOUTS
# ????????????????????????????????????????????????????????

# Tiempo máximo por turno en milisegundos (60000 = 1 minuto)
# Si un jugador no dispara en este tiempo, pierde automáticamente
turn.timeout=60000